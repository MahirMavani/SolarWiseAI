# ==============================================================================
# SolarWise AI — Netlify Configuration
# ==============================================================================

[build]
  # Serve static files from root (index.html, style.css, script.js, assets)
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**"]

# ------------------------------------------------------------------------------
# Security: Block sensitive files and backend-only folders from public web access
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/python_service/*"
  to = "/index.html"
  status = 404
  force = true

# ------------------------------------------------------------------------------
# API Routes: Route all /api/* requests to Netlify Serverless Function
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# SPA Fallback: Route all unmatched client-side requests to index.html
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# HTTP Headers for Security and Asset Performance
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
