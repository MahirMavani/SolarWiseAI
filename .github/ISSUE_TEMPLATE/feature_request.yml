name: Feature Request
description: Suggest an idea or feature for SolarWise AI
labels: ["enhancement"]
body:
  - type: input
    id: title
    attributes:
      label: Feature Title
      placeholder: e.g. Add 3D rooftop shading simulation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the feature and how it benefits users.
    validations:
      required: true
